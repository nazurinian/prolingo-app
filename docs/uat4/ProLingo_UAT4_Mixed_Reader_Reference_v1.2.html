1fr);gap:12px}.flow{font-size:var(--primary);line-height:var(--leading);text-align:var(--align);margin:0 0 9px}.paragraph .flow{ text-indent:var(--indent)}.flow.secondary{font-size:calc(var(--primary)*var(--ratio));color:#68768c}.phrase{cursor:pointer;border-radius:3px;outline-offset:2px}.phrase:hover{background:#eaf0fa}.phrase.selected{box-shadow:inset 0 -2px #d5a34c}.phrase.active[data-lang=EN]{background:#dceafe;color:#204f92}.phrase.active[data-lang=ID]{background:#eee2fb;color:#654099}.phrase.paused{background:#ffedc9}.inlineSpeaker{font:600 14px system-ui;color:var(--speaker)}.translation{padding:8px 10px;border-left:2px solid #7997cf;background:#f4f7fc;color:#52657e;font-size:calc(var(--primary)*var(--ratio));line-height:1.5;text-align:var(--align);margin:8px 0}.pair{margin-bottom:7px}.pair .flow{text-indent:0}.study{border:1px solid #96b3e5;border-radius:12px;background:#f6f9fe;padding:14px;margin-top:15px;display:grid;gap:10px}.study .flow{text-indent:0}.study .language{background:white;border:1px solid #dce4ef;border-radius:8px;padding:10px;min-width:0}.study .language.active{border-color:#7296dc}.study .language button{float:right;margin-left:8px}.focus{border:1px solid #8ca7d7;border-radius:12px;padding:14px;min-width:0}.preview{background:#f4f6fa;border:1px solid #e0e5ed;border-radius:9px;padding:10px;font-size:13px;width:90%;margin:8px auto;cursor:pointer}.preview p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0}.rail{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.rail button{flex-shrink:0}.rail small{display:block;font-size:11px}.notice{background:#fff7e4;border:1px solid #e8d8ae;border-radius:8px;padding:9px;font-size:13px}.global{position:fixed;bottom:0;left:0;right:0;background:#172237;color:#f0f5ff;padding:12px max(14px,calc((100vw - 890px)/2));box-shadow:0 -3px 15px #1b274326;z-index:5}.global small{color:#bac9dd}.global button{background:#263852;color:white;border:1px solid #536783}.global .row{gap:6px}.global .progress{height:4px;border-radius:6px;background:#43536a;margin:7px 0}.global .progress span{display:block;height:4px;background:#8eb7fa;border-radius:6px}.dark body{background:#111827;color:#e5eaf2}.dark #settings,.dark #reader,.dark button,.dark select{background:#1d293a;color:#e5eaf2;border-color:#39465a}.dark .study,.dark .study .language,.dark .preview,.dark .translation{background:#243249;color:#d5deee;border-color:#4b6388}.dark .muted,.dark small,.dark .flow.secondary,.dark .chapter-head p,.dark label{color:#b2bed0}.dark .notice{background:#332c21;color:#fae4b6}.dark .chapter.boxed{border-color:#39465a}.dark .chapter-head h3{color:#69d1c7}.dark .chapter.conversation .chapter-head h3{color:#bdb1ff}.dark .phrase.selected{box-shadow:inset 0 -2px #d5a34c}.dark button[aria-pressed=true]{background:#304d77;color:#e4edff}.narrow #reader{max-width:390px;padding:16px}.narrow .turn.aligned{grid-template-columns:70px minmax(0,1fr)}@media(max-width:650px){#settings{margin:8px}#reader{margin:12px 8px 185px;padding:16px}.turn.aligned{grid-template-columns:70px minmax(0,1fr)}.global{padding:9px 12px}.global button{padding:5px 8px}.chapter.boxed{padding:10px}}
</style><header><small>UAT-4 · Design reference · v1.2</small><h1>ProLingo Mixed Reader</h1><p class="muted">A Journey to London · 4 Cards · 11 Units · 37 bilingual Segments. Simulasi visual, bukan source aplikasi atau audio sungguhan.</p></header>

<script>
const data=[{"label": "P1", "title": "Preparing for the Journey", "units": [{"name": "Section 1", "speaker": "", "lines": [["James woke up earlier than usual because he was travelling to London that morning.", "James bangun lebih awal dari biasanya karena pagi itu ia akan bepergian ke London."], ["He had packed his suitcase the night before, but he still needed to check a few things.", "Ia telah mengemas kopernya malam sebelumnya, tetapi masih perlu memeriksa beberapa hal."], ["After having breakfast, he checked his train schedule and made sure that his phone was fully charged.", "Setelah sarapan, ia memeriksa jadwal kereta dan memastikan ponselnya terisi penuh."], ["He left the house at half past seven, feeling excited about the journey ahead.", "Ia meninggalkan rumah pukul setengah delapan, merasa bersemangat menghadapi perjalanan itu."]]}, {"name": "Section 2", "speaker": "", "lines": [["When James arrived at the railway station, the main entrance was already crowded with passengers.", "Ketika James tiba di stasiun kereta, pintu masuk utama sudah dipenuhi penumpang."], ["Some people were waiting for their trains, while others were buying tickets at the counter.", "Sebagian orang sedang menunggu kereta, sementara yang lain membeli tiket di loket."], ["James looked at the departure board to find the next available train to London.", "James melihat papan keberangkatan untuk menemukan kereta berikutnya menuju London."], ["He then walked towards the ticket office, hoping that there were still some seats available.", "Ia kemudian berjalan menuju loket tiket, berharap masih ada kursi yang tersedia."]]}]}, {"label": "C1", "title": "Buying a Train Ticket", "units": [{"name": "Turn 1", "speaker": "James", "lines": [["Good morning. I'd like to buy a ticket to London, please.", "Selamat pagi. Saya ingin membeli tiket ke London."], ["Could you tell me when the next train leaves?", "Bisakah Anda memberi tahu saya kapan kereta berikutnya berangkat?"], ["I would prefer a direct train if there is one available.", "Saya lebih memilih kereta langsung jika tersedia."]]}, {"name": "Turn 2", "speaker": "Ticket Officer", "lines": [["Certainly. The next direct train leaves at nine fifteen from platform four.", "Tentu. Kereta langsung berikutnya berangkat pukul sembilan lewat lima belas dari peron empat."], ["The journey usually takes about two hours, depending on the service.", "Perjalanan biasanya memakan waktu sekitar dua jam, tergantung layanannya."], ["Would you like a single ticket or a return ticket?", "Apakah Anda ingin tiket sekali jalan atau pulang-pergi?"]]}, {"name": "Turn 3", "speaker": "James", "lines": [["A return ticket would be better because I'm planning to come back on Sunday evening.", "Tiket pulang-pergi lebih baik karena saya berencana kembali pada Minggu malam."], ["Could I also have a seat next to the window, if possible?", "Bisakah saya mendapatkan tempat duduk di dekat jendela, jika memungkinkan?"], ["I'd like to enjoy the view during the journey.", "Saya ingin menikmati pemandangan selama perjalanan."]]}, {"name": "Turn 4", "speaker": "Ticket Officer", "lines": [["Of course. I've reserved a window seat for you in carriage B.", "Tentu. Saya telah memesan kursi dekat jendela untuk Anda di gerbong B."], ["Here is your ticket, and please keep it with you until you leave the station in London.", "Ini tiket Anda, dan mohon simpan sampai Anda meninggalkan stasiun di London."], ["Have a pleasant journey, and thank you for travelling with us.", "Semoga perjalanan Anda menyenangkan, dan terima kasih telah bepergian bersama kami."]]}]}, {"label": "P2", "title": "On the Train", "units": [{"name": "Section 1", "speaker": "", "lines": [["The train departed on time, and James quickly settled into his comfortable window seat.", "Kereta berangkat tepat waktu, dan James segera duduk dengan nyaman di kursi dekat jendela."], ["As the train moved through the countryside, he watched the green fields and small villages pass by.", "Saat kereta melintasi pedesaan, ia mengamati ladang hijau dan desa-desa kecil yang dilewatinya."], ["He took out a book from his bag and began reading while enjoying a cup of coffee.", "Ia mengeluarkan buku dari tasnya dan mulai membaca sambil menikmati secangkir kopi."], ["About half an hour later, a young woman entered the carriage and sat opposite him.", "Sekitar setengah jam kemudian, seorang perempuan muda memasuki gerbong dan duduk di hadapannya."], ["She smiled politely before asking him a question about the journey.", "Ia tersenyum dengan sopan sebelum mengajukan pertanyaan tentang perjalanan."]]}]}, {"label": "C2", "title": "Meeting Another Passenger", "units": [{"name": "Turn 1", "speaker": "Emma", "lines": [["Excuse me, do you know whether this train stops at Reading?", "Permisi, apakah Anda tahu apakah kereta ini berhenti di Reading?"], ["I don't travel by train very often, so I'm not familiar with this route.", "Saya tidak terlalu sering bepergian dengan kereta, jadi saya tidak begitu mengenal rute ini."], ["I just want to make sure that I've got on the right train.", "Saya hanya ingin memastikan bahwa saya naik kereta yang benar."]]}, {"name": "Turn 2", "speaker": "James", "lines": [["Yes, I believe Reading is the next major stop.", "Ya, saya rasa Reading adalah pemberhentian besar berikutnya."], ["According to the schedule, we should arrive there in about twenty minutes.", "Menurut jadwal, kita seharusnya tiba di sana sekitar dua puluh menit lagi."], ["You can also check the information screen at the end of the carriage.", "Anda juga bisa memeriksa layar informasi di ujung gerbong."]]}, {"name": "Turn 3", "speaker": "Emma", "lines": [["That's very helpful. Thank you for explaining it to me.", "Itu sangat membantu. Terima kasih telah menjelaskannya kepada saya."], ["I'm visiting an old friend who recently moved there for work.", "Saya akan mengunjungi seorang teman lama yang baru saja pindah ke sana untuk bekerja."], ["Are you travelling to London for business or for a holiday?", "Apakah Anda bepergian ke London untuk urusan bisnis atau liburan?"]]}, {"name": "Turn 4", "speaker": "James", "lines": [["I'm spending the weekend in London to visit a few museums and practise my English.", "Saya akan menghabiskan akhir pekan di London untuk mengunjungi beberapa museum dan berlatih bahasa Inggris."], ["I've been studying the language for several months, and I'd like to become more confident when speaking.", "Saya telah mempelajari bahasa ini selama beberapa bulan dan ingin menjadi lebih percaya diri ketika berbicara."], ["It's always nice to meet someone new during a journey like this.", "Selalu menyenangkan bertemu seseorang yang baru dalam perjalanan seperti ini."]]}]}];const all=data.flatMap((c,i)=>c.units.flatMap((u,j)=>u.lines.map((l,k)=>({i,j,k,l}))));
const S={mode:'Full',align:'left',speaker:'Aligned',indent:true,language:'EN',style:'Contextual',placement:'Below',orientation:'Vertical',visibility:'All',opens:[true,true,true,true],font:18,ratio:75,leading:1.7,narrow:false,dark:false,units:[0,0,0,0],segments:data.map(c=>c.units.map(()=>0)),cursor:12,channel:'EN',status:'Stopped',intent:'Single',scope:'Workspace',representation:'Split',expanded:false,follow:true,selection:12,queue:[],qi:0};
const colors={'James':'#5688d7','Ticket Officer':'#936bc8','Emma':'#269a83'};const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const idx=(i,j,k)=>all.findIndex(a=>a.i===i&&a.j===j&&a.k===k);const cur=()=>all[S.cursor];const dual=()=>S.language.includes('-');const primary=()=>S.language.startsWith('ID')?'ID':'EN';const secondary=()=>primary()==='EN'?'ID':'EN';const channelIndex=c=>c==='EN'?0:1;const permitted=()=>S.mode==='Segment'?['Sentence Interlinear','Notebook']:['Separated','Sentence Interlinear','Notebook','Contextual'];const style=()=>dual()&&permitted().includes(S.style)?S.style:'Primary only';
function set(k,v){S[k]=v;render()}function select(i,j,k,manual=true){S.units[i]=j;S.segments[i][j]=k;S.selection=idx(i,j,k);if(manual)S.follow=false}function choose(i,j,k,ch){select(i,j,k);if(S.mode!=='Segment')start(i,j,k,ch,'Single','Segment');else render()}
function start(i,j,k,ch,intent,scope){let a=idx(i,j,k);S.channel=ch;S.intent=intent;S.scope=scope;S.status='Playing';S.follow=true;S.actualRep='Split';S.queue=all.map((v,n)=>n).filter(n=>n>=a&&(intent==='Single'?n===a:scope==='Unit'?all[n].i===i&&all[n].j===j:scope==='Card'?all[n].i===i:true));S.qi=0;syncCursor(a);render()}
function syncCursor(n){S.cursor=n;if(S.follow){let a=cur();select(a.i,a.j,a.k,false);if(S.visibility==='Custom')S.opens[a.i]=true;}}
function next(){if(S.status==='Stopped')return; if(S.actualRep==='Full'){let i=cur().i+1;if(i>=data.length){stop();return}syncCursor(idx(i,0,0));render();return}if(S.qi+1>=S.queue.length){stop();return}syncCursor(S.queue[++S.qi]);render()}
function prev(){if(S.status==='Stopped')return;if(S.actualRep==='Full'){syncCursor(idx(Math.max(0,cur().i-1),0,0));}else if(S.qi>0)syncCursor(S.queue[--S.qi]);render()}
function stop(){S.status='Stopped';render()}function globalPlay(){if(S.status==='Playing'){S.status='Paused';render();return}if(S.status==='Paused'){S.status='Playing';render();return}let a=all[S.selection];if(S.representation==='Full'){S.actualRep='Full';S.status='Playing';S.follow=true;S.scope='Workspace';syncCursor(idx(a.i,0,0));render()}else start(a.i,a.j,a.k,primary(),'Continuous','Workspace')}
function toggle(i){if(S.visibility!=='Custom'){S.opens=data.map((_,n)=>open(n));S.visibility='Custom'}S.opens[i]=!S.opens[i];render()}function open(i){return S.mode==='Full'||S.visibility==='All'||(S.visibility==='Follow'?cur().i===i:S.opens[i])}
function button(label,code,active=false){return `<button ${active?'aria-pressed="true"':''} onclick="${code}">${esc(label)}</button>`}function selectControl(label,key,options){return `<label>${label} <select onchange="set('${key}',this.value)">${options.map(v=>`<option ${S[key]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function settings(){document.getElementById('settings').innerHTML=`<div class="row">${['Full','Card','Focus','Segment'].map(v=>button(v,`set('mode','${v}')`,S.mode===v)).join('')}<small>Reader Mode</small></div><div class="settingsgroup">${selectControl('Alignment','align',['left','justify'])}${selectControl('Speaker layout','speaker',['Stacked','Aligned','Inline'])}<label><input type="checkbox" ${S.indent?'checked':''} onchange="set('indent',this.checked)"> Paragraph indent</label></div><div class="settingsgroup">${selectControl('Reading language','language',['EN','ID','EN-ID','ID-EN'])}${dual()?selectControl('Bilingual style','style',permitted()):''}${dual()&&style()==='Contextual'?selectControl('Translation position','placement',['Above','Below','Inline']):''}${S.mode==='Focus'?selectControl('Focus style','orientation',['Vertical','Horizontal']):''}${S.mode!=='Full'?selectControl('Card visibility','visibility',['All','Follow','Custom']):''}</div><div class="settingsgroup"><label>Primary ${S.font}px <input type="range" min="14" max="24" value="${S.font}" onchange="set('font',+this.value)"></label><label>Translation ${S.ratio}% <input type="range" min="60" max="100" step="5" value="${S.ratio}" onchange="set('ratio',+this.value)"></label><label><input type="checkbox" ${S.narrow?'checked':''} onchange="set('narrow',this.checked)"> Mobile width</label><label><input type="checkbox" ${S.dark?'checked':''} onchange="set('dark',this.checked)"> Dark</label></div><div class="settingsgroup">${selectControl('Audio preference (sim.)','representation',['Split','Full'])}${button('Return to Playing','S.follow=true;syncCursor(S.cursor);render()')}</div>${dual()&&!permitted().includes(S.style)?'<small>Style lama tidak tersedia di mode ini; preview menggunakan satu bahasa utama tanpa menghapus preferensi.</small>':''}${style()==='Notebook'?'<div class="notice">Notebook Parallel Flow belum diimplementasikan. Preview konteks sementara primary-only; tidak menyamarkan Sentence Interlinear sebagai Notebook.</div>':''}`}
function phrase(i,j,k,ch){let a=idx(i,j,k),f=all[a];let cl='phrase'+(S.selection===a?' selected':'')+(S.status!=='Stopped'&&S.actualRep!=='Full'&&S.cursor===a&&S.channel===ch?(S.status==='Paused'?' paused':' active'):'');return `<span tabindex="0" role="button" class="${cl}" data-lang="${ch}" onclick="choose(${i},${j},${k},'${ch}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}">${esc(f.l[channelIndex(ch)])}</span>`}
function textFlow(i,j,ch,ks,secondaryText=false,prefix=''){return `<p class="flow ${secondaryText?'secondary':''}">${prefix}${ks.map(k=>phrase(i,j,k,ch)).join(' ')}</p>`}
function unit(i,j){let u=data[i].units[j],ks=u.lines.map((_,k)=>k),p=primary(),t=secondary(),st=style(),isTurn=!!u.speaker,sp=isTurn?`<span class="inlineSpeaker">${esc(u.speaker)}: </span>`:'',prefix=S.speaker==='Inline'?sp:'',label=isTurn&&S.speaker!=='Inline'?`<div class="speaker">${esc(u.speaker)}:</div>`:'';let content='';let a=S.status!=='Stopped'&&S.actualRep==='Full'?null:(S.status!=='Stopped'&&S.follow?cur():all[S.selection]);let k=a&&a.i===i&&a.j===j?a.k:null;
let translation=k===null?'':`<div class="translation">${phrase(i,j,k,t)}</div>`;
if(st==='Separated'){content=textFlow(i,j,p,ks,false,prefix)+textFlow(i,j,t,ks,true)}else if(st==='Sentence Interlinear'){content=ks.map((k,n)=>`<div class="pair">${textFlow(i,j,p,[k],false,n===0?prefix:'')}${textFlow(i,j,t,[k],true)}</div>`).join('')}else if(st==='Contextual'&&k!==null&&S.placement==='Inline'){content=textFlow(i,j,p,ks.slice(0,k+1),false,prefix)+translation+(k<ks.length-1?textFlow(i,j,p,ks.slice(k+1)):'')}else{content=(st==='Contextual'&&S.placement==='Above'?translation:'')+textFlow(i,j,p,ks,false,prefix)+(st==='Contextual'&&S.placement==='Below'?translation:'')}
return `<div class="unit ${isTurn?'turn '+S.speaker.toLowerCase():'paragraph'}" style="--speaker:${colors[u.speaker]||'#64748b'}">${label}<div class="unitbody">${S.mode!=='Full'?`<small>${u.name} · ${u.lines.length} SG</small>`:''}${content}</div></div>`}
function setUnit(i,j){select(i,j,S.segments[i][j]);render()}function rail(i){return `<div class="rail">${data[i].units.map((u,j)=>`<button aria-pressed="${S.units[i]===j}" onclick="setUnit(${i},${j})">${esc(u.name)}<small>${esc(u.speaker||'')} ${u.lines.length} SG</small></button>`).join('')}</div>`}
function focus(i){let j=S.units[i],c=data[i];if(c.units.length===1)return unit(i,j);let preview=n=>`<div class="preview" tabindex="0" role="button" onclick="setUnit(${i},${n})" onkeydown="if(event.key==='Enter')this.click()"><b>${esc(c.units[n].name)} ${esc(c.units[n].speaker)}</b><p>${esc(c.units[n].lines[0][channelIndex(primary())])}</p></div>`;return `${S.orientation==='Vertical'&&j>0?preview(j-1):''}<div class="focus">${unit(i,j)}</div>${S.orientation==='Vertical'&&j<c.units.length-1?preview(j+1):''}${rail(i)}<div class="row spread"><button ${j===0?'disabled':''} onclick="setUnit(${i},${j-1})">← Previous</button><small>${S.orientation} focus · ${j+1}/${c.units.length}</small><button ${j===c.units.length-1?'disabled':''} onclick="setUnit(${i},${j+1})">Next →</button></div>`}
function study(i){let c=data[i],j=S.units[i],k=S.segments[i][j],u=c.units[j],n=idx(i,j,k),p=primary(),t=secondary();let playing=ch=>S.status!=='Stopped'&&S.actualRep!=='Full'&&S.cursor===n&&S.channel===ch;return `<div class="study"><div class="row spread"><b>Segment Study Box</b><small>${c.label} · ${u.name} · SG${k+1}/${u.lines.length}</small></div>${c.units.length>1?rail(i):''}${[p,t].map(ch=>`<div class="language ${playing(ch)?'active':''}"><button onclick="${playing(ch)?'stop()':`start(${i},${j},${k},'${ch}','Single','Segment')`}">${playing(ch)?'■ Stop':'▶ '+ch}</button><small>${ch} ${esc(u.speaker)}</small><p class="flow ${ch===t?'secondary':''}">${esc(u.lines[k][channelIndex(ch)])}</p></div>`).join('')}<div class="rail">${u.lines.map((_,v)=>button(String(v+1),`select(${i},${j},${v});render()`,k===v)).join('')}</div><div class="row"><button onclick="start(${i},${j},${k},'${p}','Single','Segment')">▶ Play once</button><select aria-label="Continue scope" id="scope${i}"><option>Unit</option><option selected>Card</option><option>Workspace</option></select><button onclick="start(${i},${j},${k},'${p}','Continuous',document.getElementById('scope${i}').value)">Play &amp; continue</button></div></div>`}
function render(){document.documentElement.classList.toggle('dark',S.dark);document.documentElement.classList.toggle('narrow',S.narrow);settings();let reader=document.getElementById('reader');reader.style.setProperty('--align',S.align);reader.style.setProperty('--indent',S.indent?'1.5em':'0');reader.style.setProperty('--primary',S.font+'px');reader.style.setProperty('--ratio',S.ratio/100);reader.innerHTML=`<div class="booktitle"><small>Mixed Workspace</small><h2>A Journey to London</h2><div class="muted">Perjalanan ke London</div></div>`+data.map((c,i)=>`<section class="chapter ${c.label.startsWith('C')?'conversation':'paragraph'} ${S.mode!=='Full'?'boxed':''}" ${S.status!=='Stopped'&&S.actualRep==='Full'&&cur().i===i?'style="outline:2px solid #86a5d5;outline-offset:4px"':''}><div class="chapter-head"><div><p>Card ${i+1}/4 · ${c.label} · ${c.units.length} ${c.label.startsWith('C')?'Turns':'Sections'}</p><h3>${esc(c.title)}</h3></div>${S.mode!=='Full'?`<button onclick="toggle(${i})">${open(i)?'−': '+'}</button>`:''}</div>${open(i)?(S.mode==='Focus'?focus(i):c.units.map((_,j)=>unit(i,j)).join(''))+(S.mode==='Segment'?study(i):''):''}</section>`).join('');player()}
function player(){let a=cur(),c=data[a.i],u=c.units[a.j],st=S.status==='Stopped',full=S.actualRep==='Full',detail=`Card ${a.i+1}/4 · ${c.label}`+(full?' · Full':` · ${u.name} · ${u.speaker?u.speaker+' · ':''}SG${a.k+1}/${u.lines.length}`);document.getElementById('player').innerHTML=`<div class="row spread"><b>A Journey to London</b><button onclick="set('expanded',!S.expanded)">${S.expanded?'Hide':'Details'}</button></div><small>${st?'Stopped · selection preserved':esc(detail)+' · '+S.channel+' · '+(full?'Full':'Split')}</small>${S.expanded?`<div><small>${st?'No active playback':esc(c.title)+' · '+esc(S.scope)+' · '+(full?'Card precision':esc(a.l[channelIndex(S.channel)]))}</small></div>`:''}<div class="progress"><span style="width:${st?0:full?(a.i+1)/4*100:(S.qi+1)/Math.max(1,S.queue.length)*100}%"></span></div><div class="row"><button onclick="stop()">■ Stop</button><button onclick="prev()">⏮</button><button onclick="globalPlay()">${S.status==='Playing'?'Ⅱ Pause':'▶ Play'}</button><button onclick="next()">⏭</button><small> ${S.status} · ${full?'Card':'Queue'} position (not duration)</small></div>`}
render();
</script></html>
